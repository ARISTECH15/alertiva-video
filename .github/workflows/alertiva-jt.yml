name: Alertiva — Le JT du soir

# Récap vidéo de toute l'actu du jour, chaque soir (Paris 22h00 = UTC 20h00 l'été).
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: alertiva-jt
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Voix off gratuite (edge-tts)
        run: python -m pip install --upgrade edge-tts

      - name: Dépendances système (ffmpeg + libs Chrome headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libxkbcommon0 \
            libpango-1.0-0 libcairo2 libasound2 fonts-liberation

      - name: Installer les dépendances Node
        run: npm ci

      - name: Préparer le navigateur de rendu (Remotion)
        run: npx remotion browser ensure

      - name: Générer le JT du soir
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node make-jt.mjs
