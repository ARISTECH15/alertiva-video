name: Alertiva — Le JT du soir

# Récap vidéo de toute l'actu du jour, chaque soir à 20h00 HEURE DE PARIS.
#
# GitHub planifie en UTC et ignore le changement d'heure : un seul cron donnerait
# 20h l'été puis 19h l'hiver. On déclenche donc aux DEUX heures possibles
# (18h UTC = 20h à Paris l'été, 19h UTC = 20h à Paris l'hiver) et un premier job
# ne laisse passer que celle qui correspond réellement à 20h à Paris.
on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: alertiva-jt
  cancel-in-progress: false

jobs:
  # Portier : quelques secondes, évite de lancer un rendu de 90 min pour rien.
  heure:
    runs-on: ubuntu-22.04
    outputs:
      go: ${{ steps.paris.outputs.go }}
    steps:
      - id: paris
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lancement manuel — on rend le JT."
            echo "go=oui" >> "$GITHUB_OUTPUT"; exit 0
          fi
          H=$(TZ=Europe/Paris date +%H)
          if [ "$H" = "20" ]; then
            echo "Il est 20h à Paris — c'est l'heure du JT."
            echo "go=oui" >> "$GITHUB_OUTPUT"
          else
            echo "Il est ${H}h à Paris — ce n'est pas l'heure, on s'arrête (heure d'été/hiver)."
            echo "go=non" >> "$GITHUB_OUTPUT"
          fi

  render:
    needs: heure
    if: needs.heure.outputs.go == 'oui'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Voix off gratuite (edge-tts)
        run: python -m pip install --upgrade edge-tts

      - name: Dépendances système (ffmpeg + libs Chrome headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libxkbcommon0 \
            libpango-1.0-0 libcairo2 libasound2 fonts-liberation

      - name: Installer les dépendances Node
        run: npm ci

      - name: Préparer le navigateur de rendu (Remotion)
        run: npx remotion browser ensure

      - name: Générer le JT du soir
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node make-jt.mjs
