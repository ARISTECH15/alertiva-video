name: Alertiva — Test brouillon TikTok

on:
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Déposer la dernière vidéo en brouillon TikTok
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node publish-latest.mjs
