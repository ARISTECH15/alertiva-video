name: Alertiva — Vidéo par article

# Rendu 100% en ligne : aucun besoin de garder le PC allumé.
# ~8 vidéos/jour aux heures de forte audience (Paris = UTC+2 l'été).
on:
  schedule:
    - cron: "30 6,8,10,12,14,16,18,20 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier sur les réseaux (FB/IG/YouTube) ? Décoché = rendu de test seul."
        type: boolean
        default: false

concurrency:
  group: alertiva-article
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Voix off gratuite (edge-tts)
        run: python -m pip install --upgrade edge-tts

      - name: Dépendances système (ffmpeg + libs Chrome headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libxkbcommon0 \
            libpango-1.0-0 libcairo2 libasound2 fonts-liberation

      - name: Installer les dépendances Node
        run: npm ci

      - name: Préparer le navigateur de rendu (Remotion)
        run: npx remotion browser ensure

      - name: Générer la vidéo du meilleur article récent
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Voix premium (facultatif) : si le secret existe, ttsBest() l'utilise ;
          # sinon repli automatique edge-tts. On peut aussi mettre la clé dans
          # Supabase settings.voice_key_elevenlabs (lue via le service role).
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # Images gpt-image (OpenRouter). Absente/sans crédit → repli auto sur Pexels.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Déclenchement manuel sans cocher « publish » = rendu de test : on rend et
          # on upload sur Supabase, mais on NE publie PAS sur les réseaux. Le cron
          # planifié (github.event.inputs.publish vide) publie normalement.
          META_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true') && '0' || '1' }}
          YT_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true') && '0' || '1' }}
          # TikTok : OFF tant que l'app n'est pas auditée. Après audit, mettre les VARIABLES
          # de dépôt GitHub TIKTOK_LIVE=1 puis TIKTOK_DIRECT=1 (Settings → Variables) →
          # publication directe et publique sur @alertiva, 0 intervention. Un dispatch de
          # test (publish décoché) force TikTok à OFF pour ne pas polluer le compte.
          TIKTOK_LIVE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true') && '0' || vars.TIKTOK_LIVE }}
          TIKTOK_DIRECT: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true') && '0' || vars.TIKTOK_DIRECT }}
        run: node make-article.mjs
