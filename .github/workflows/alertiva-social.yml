name: Alertiva — Posts d'articles (Facebook + Instagram)

# Publie quelques articles récents (image + accroche + lien) plusieurs fois par jour.
on:
  schedule:
    - cron: "15 7,11,15,19 * * *"
  workflow_dispatch: {}

concurrency:
  group: alertiva-social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publier les articles récents sur FB + IG
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node post-articles.mjs
