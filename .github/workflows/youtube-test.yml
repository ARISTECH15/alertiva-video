name: Alertiva — Test upload YouTube

on:
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Upload la dernière vidéo sur YouTube (non répertorié)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node youtube-test.mjs
