name: Alertiva — Test TTS Qwen (OpenRouter)

# Valide l'endpoint TTS Qwen-Audio-3.0-TTS via OpenRouter (100% manuel).
on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voix Qwen à tester (facultatif)"
        required: false
        default: ""

jobs:
  tts:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sonder les voix Qwen valides
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node probe-tts.mjs
