name: Alertiva — Test TTS Qwen (OpenRouter)

# Valide l'endpoint TTS Qwen-Audio-3.0-TTS via OpenRouter (100% manuel).
on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voix Qwen à tester (facultatif)"
        required: false
        default: ""

jobs:
  tts:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Générer un court échantillon TTS
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TTS_VOICE: ${{ github.event.inputs.voice }}
        run: |
          node -e "import('./lib/alertiva.mjs').then(m => m.ttsQwen('Bonjour, ceci est un test de la voix Qwen 3 pour Alertiva News. La lutte contre la désinformation continue.', 'out-test.mp3')).then(p => console.log('OK ttsQwen →', p)).catch(e => { console.error('ECHEC ttsQwen:', e.message); process.exit(1); })"
      - name: Vérifier le fichier audio
        run: ls -la out-test.mp3 && file out-test.mp3 || true
